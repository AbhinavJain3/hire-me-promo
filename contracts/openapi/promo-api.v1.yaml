openapi: 3.1.0
info:
  title: HireMe Promo API (existing; contract to be confirmed by HireMe)
  version: 1.0.0-rc1
  description: |
    The engine creates every promo code through this API; codes are never stored only in the engine (spec 6.3).
    Built from the spec section 8.2 sample. **It must be matched to the actual HireMe Promo API (OQ-08).**
    Additions we ask the backend to support are marked "(requested)": the `Idempotency-Key` header,
    the usage and deactivate endpoints, and the redemption webhook (spec 8.2 "also needed").

    The mock Promo API (engage-mocks) implements this contract now (D-014); docs/API.md §6.1 describes its behaviour.
servers:
  - url: https://{host}
    variables:
      host: { default: hireme-backend.example.test }
security:
  - serviceToken: []
paths:
  /api/admin/promocodes:
    post:
      operationId: createPromoCode
      summary: Create a promo code
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: (requested) The engine sends its decision id. A replay within 24 h returns the original response with 200 and `Idempotent-Replayed true`.
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoCreate' }
            examples:
              b2_personal:
                summary: Spec 8.2 sample, plus engine meta fields
                value:
                  code: GO15-7KQ2
                  type: percent
                  value: 15
                  max_discount: 75
                  min_fare: 100
                  user_id: u_88213
                  usage_limit: 1
                  city_ids: [3]
                  vehicle_types: [mini, sedan]
                  valid_from: "2026-10-21T18:25:00+05:30"
                  valid_to: "2026-10-21T20:25:00+05:30"
                  meta: { campaign_id: cmp_1042, playbook_id: B2_abandoned_booking, created_by: ai, decision_id: dec_8f3a91c2e0d4b7a65c1e2f90, engage_promo_ref: prm_8f3a91c2e0d4b7a65c1e2f90 }
              diwali_campaign:
                summary: Readable multi-use campaign code
                value:
                  code: DIWALI20
                  type: percent
                  value: 20
                  max_discount: 100
                  min_fare: 150
                  user_id: null
                  usage_limit: 5000
                  city_ids: [1, 2, 3]
                  vehicle_types: [mini, sedan, prime, suv]
                  valid_from: "2026-11-06T00:00:00+05:30"
                  valid_to: "2026-11-10T23:59:59+05:30"
                  meta: { campaign_id: cmp_diwali2026, playbook_id: null, created_by: admin }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCreated' }
              examples:
                created: { value: { promo_id: 55120, code: GO15-7KQ2, status: active } }
        '200':
          description: (requested) Idempotent replay of an earlier create with the same Idempotency-Key
          headers:
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCreated' }
        '409': { description: 'CODE_EXISTS: code collision; the engine generates a new random suffix and retries (max 3)' }
        '422': { description: 'Invalid restriction; the engine treats it as permanent (promo_api_error)' }
        '429': { description: Rate limited; retried with backoff and the same key }
        '503': { description: Unavailable; retried with backoff and the same key (timeout 3 s) }
  /api/admin/promocodes/{promo_id}/usage:
    get:
      operationId: getPromoUsage
      summary: (requested) Usage of a code, for reconciliation
      parameters:
        - $ref: '#/components/parameters/PromoId'
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoUsage' }
              examples:
                used_once:
                  value:
                    promo_id: 55120
                    uses: 1
                    redemptions:
                      - { ride_id: r_4821, user_id: u_88213, discount_inr: 63.0, redeemed_at: "2026-10-21T18:31:40+05:30" }
        '404': { description: Unknown promo }
  /api/admin/promocodes/{promo_id}:
    patch:
      operationId: deactivatePromoCode
      summary: (requested) Deactivate a code
      description: Used on campaign cancel, kill switch with deactivate_codes, and user unsubscribe.
      parameters:
        - $ref: '#/components/parameters/PromoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { const: inactive }
                reason: { enum: [campaign_cancelled, kill_switch, user_unsubscribed, fraud, admin] }
            examples:
              cancel: { value: { status: inactive, reason: campaign_cancelled } }
      responses:
        '200': { description: Deactivated }
        '404': { description: Unknown promo }
webhooks:
  promoRedeemed:
    post:
      summary: (requested) Redemption webhook the Promo API calls on the engine
      description: Delivered to `POST /engage/v1/webhooks/promo-redeemed`; schema and signing in engage-ingest.v1.yaml.
      requestBody:
        content:
          application/json:
            schema: { $ref: './engage-ingest.v1.yaml#/components/schemas/PromoRedeemedWebhook' }
      responses:
        '200': { description: Applied or duplicate }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    PromoId:
      name: promo_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Timestamp:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-][0-9]{2}:[0-9]{2})$'
    PromoCreate:
      type: object
      additionalProperties: false
      required: [code, type, value, user_id, usage_limit, city_ids, valid_from, valid_to, meta]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{2,19}$', description: 'Readable for campaigns (DIWALI20); random for personal offers (GO15-7KQ2), D-038.' }
        type: { enum: [percent, flat, free_ride, cashback, upgrade], description: 'Spec 6.3 types.' }
        value: { description: 'percent: 1-100; flat/free_ride/cashback: INR amount (free_ride = cap); upgrade: target vehicle type.' }
        max_discount: { type: [number, 'null'], minimum: 0, description: INR cap }
        min_fare: { type: [number, 'null'], minimum: 0, description: INR }
        user_id: { type: [string, 'null'], pattern: '^u_[0-9]{1,12}$', description: 'Set for user-locked personal codes; null for campaign codes.' }
        usage_limit: { type: integer, minimum: 1 }
        city_ids: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        vehicle_types: { type: array, items: { enum: [mini, sedan, prime, suv] } }
        first_ride_only: { type: boolean, default: false }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
        meta:
          type: object
          additionalProperties: false
          required: [campaign_id, created_by]
          description: Attribution (spec 6.3). decision_id and engage_promo_ref are engine additions.
          properties:
            campaign_id: { type: string }
            playbook_id: { type: [string, 'null'] }
            created_by: { enum: [ai, admin] }
            decision_id: { type: string, pattern: '^dec_[0-9a-f]{12,32}$' }
            engage_promo_ref: { type: string, pattern: '^prm_[0-9a-f]{12,32}$' }
      allOf:
        - if: { properties: { type: { const: percent } }, required: [type] }
          then: { properties: { value: { type: number, exclusiveMinimum: 0, maximum: 100 } } }
        - if: { properties: { type: { enum: [flat, free_ride, cashback] } }, required: [type] }
          then: { properties: { value: { type: number, exclusiveMinimum: 0 } } }
        - if: { properties: { type: { const: upgrade } }, required: [type] }
          then: { properties: { value: { enum: [sedan, prime, suv] } } }
    PromoCreated:
      type: object
      required: [promo_id, code, status]
      properties:
        promo_id: { type: integer, minimum: 1 }
        code: { type: string }
        status: { enum: [active, inactive] }
    PromoUsage:
      type: object
      required: [promo_id, uses, redemptions]
      properties:
        promo_id: { type: integer }
        uses: { type: integer, minimum: 0 }
        redemptions:
          type: array
          items:
            type: object
            required: [ride_id, user_id, discount_inr, redeemed_at]
            properties:
              ride_id: { type: string }
              user_id: { type: string }
              discount_inr: { type: number, minimum: 0 }
              redeemed_at: { $ref: '#/components/schemas/Timestamp' }

# fare = max(base, base + per_km * km + per_min * minutes) * surge   (DUMMY_DATA_PLAN §3)
vehicle_types:
  - { vehicle_type: mini,  display_name: Mini,  base_fare_inr: 50,  per_km_inr: 12, per_min_inr: 1.0 }
  - { vehicle_type: sedan, display_name: Sedan, base_fare_inr: 70,  per_km_inr: 15, per_min_inr: 1.5 }
  - { vehicle_type: prime, display_name: Prime, base_fare_inr: 90,  per_km_inr: 18, per_min_inr: 2.0 }
  - { vehicle_type: suv,   display_name: SUV,   base_fare_inr: 120, per_km_inr: 22, per_min_inr: 2.5 }

trip:
  road_factor: 1.3              # road km = straight-line km * road_factor
  intra_zone_km: [2.0, 6.0]     # trips inside one zone
  min_per_km_offpeak: 2.6
  min_per_km_peak: 3.2
  # Surge is a property of (pickup zone, IST date, hour), identical for every rider (hash of the seed).
  surge:
    peak_hours_weekday: [[8.0, 10.5], [18.0, 21.0]]
    peak_zone_types: [business, airport, railway]
    peak_probability: 0.55
    peak_range: [1.2, 1.8]
    rain_probability: 0.6
    rain_range: [1.2, 1.6]
    festival_evening_hours: [18, 23]
    festival_probability: 0.5
    festival_range: [1.2, 1.5]

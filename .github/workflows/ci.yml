# CI for the HireMe AI Engagement Engine (milestone M0.2, D-095).
# No cloud access: everything runs on synthetic data, the mocks and the Firestore emulator
# (project id "demo-*", which never reaches a real project). BigQuery checks (sql/checks) run by hand
# against the dev project, see docs/LOAD_RUNBOOK.md.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-java@v4      # Firestore emulator needs Java 21 (D-085)
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.34.1

      - name: Syntax check
        run: python -m compileall -q engage mocks sim tests

      - name: Contract - generated files up to date
        run: python -m engage.tools.gen_contract --check

      - name: Contract - validate all artefacts
        run: python -m engage.tools.validate_contract --all

      - name: Synthetic data - generate tiny and run local checks
        run: |
          python -m sim.generator --scale tiny --seed 42 --out "$RUNNER_TEMP/tiny_s42" --force --quiet
          python -m sim.validate "$RUNNER_TEMP/tiny_s42"

      - name: Tests (with the Firestore emulator)
        run: >
          firebase emulators:exec --only firestore --project demo-hireme-engage-dev
          "python -m pytest -q -rs"
